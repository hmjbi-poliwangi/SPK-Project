{% extends "base.html" %}
{% block content %}
<h1 class="page-title"><svg class="w-6 h-6 inline-block mr-2 -mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>Manajemen Aspek</h1>

<div class="toolbar">
    <button class="btn btn-yellow" onclick="openAspectModal()">+ Tambah Aspek</button>
</div>

<div class="table-wrapper">
<table class="data-table" id="aspect-table">
    <thead>
        <tr>
            <th>Nomor</th>
            <th style="width:auto">Nama Aspek</th>
            <th>Bobot</th>
            <th>Aksi</th>
        </tr>
    </thead>
    <tbody id="aspect-table-body"></tbody>
</table>
</div>

<!-- Modal Tambah/Edit Aspek -->
<div class="modal-overlay" id="aspect-modal">
    <div class="modal-dialog">
        <h3 id="aspect-modal-title">Tambah Aspek</h3>
        <input type="hidden" id="aspect-edit-id">
        <div class="form-group">
            <label for="aspect-name">Nama Aspek</label>
            <input type="text" id="aspect-name" class="form-input" placeholder="Masukkan nama aspek">
        </div>
        <div class="form-group">
            <label for="aspect-weight">Bobot Aspek</label>
            <input type="number" id="aspect-weight" class="form-input" step="0.1" min="0" max="10" value="1.0">
        </div>
        <div class="modal-actions">
            <button class="btn btn-gray" onclick="closeModal('aspect-modal')">Batal</button>
            <button class="btn btn-green" onclick="saveAspect()">Simpan</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// ============================================================
// CRUD Aspects
// ============================================================

function loadAspects() {
    fetch('/api/aspects')
        .then(r => r.json())
        .then(data => {
            const tbody = document.getElementById('aspect-table-body');
            tbody.innerHTML = '';
            data.forEach((a, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${escapeHtml(a.name)}</td>
                    <td>${a.weight}</td>
                    <td>
                        <div class="btn-group">
                            <button class="btn btn-blue btn-sm" onclick="editAspect(${a.id}, '${escapeHtml(a.name)}', ${a.weight})">Edit</button>
                            <button class="btn btn-red btn-sm" onclick="deleteAspect(${a.id})">Hapus</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        });
}

function openAspectModal() {
    document.getElementById('aspect-modal-title').textContent = 'Tambah Aspek';
    document.getElementById('aspect-edit-id').value = '';
    document.getElementById('aspect-name').value = '';
    document.getElementById('aspect-weight').value = 1.0;
    openModal('aspect-modal');
}

function editAspect(id, name, weight) {
    document.getElementById('aspect-modal-title').textContent = 'Edit Aspek';
    document.getElementById('aspect-edit-id').value = id;
    document.getElementById('aspect-name').value = name;
    document.getElementById('aspect-weight').value = weight;
    openModal('aspect-modal');
}

function saveAspect() {
    const id = document.getElementById('aspect-edit-id').value;
    const name = document.getElementById('aspect-name').value.trim();
    const weight = parseFloat(document.getElementById('aspect-weight').value);

    if (!name) {
        showAlert('Nama aspek harus diisi', 'error');
        return;
    }

    const url = id ? `/api/aspects/${id}` : '/api/aspects';
    const method = id ? 'PUT' : 'POST';

    fetch(url, {
        method: method,
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name, weight})
    })
    .then(r => r.json())
    .then(res => {
        if (res.error) {
            showSimpleError(res.error, 'Data sudah ada/duplikat atau terjadi kesalahan');
        } else {
            closeModal('aspect-modal');
            loadAspects();
            showAlert(res.message, 'success');
        }
    })
    .catch(err => console.error(err));
}

function deleteAspect(id) {
    if (!confirm('Hapus aspek ini?')) return;
    fetch(`/api/aspects/${id}`, {method: 'DELETE'})
        .then(r => r.json())
        .then(res => {
            if (res.error) {
                showSimpleError(res.error, 'Terjadi kesalahan saat menghapus data');
            } else {
                loadAspects();
                showAlert(res.message, 'success');
            }
        })
        .catch(err => console.error(err));
}

loadAspects();
</script>
{% endblock %}
