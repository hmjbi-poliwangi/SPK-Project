{% extends "base.html" %}
{% block content %}
<div class="header-info">
    <h1 class="page-title" style="margin-bottom:0;">🏢 {{ department.name }}</h1>
    <div class="btn-group">
        <a href="/departments" class="btn btn-gray btn-sm">← Kembali</a>
        <button class="btn btn-blue btn-sm" onclick="renameDepartment()">Ubah Nama</button>
    </div>
</div>

<div id="aspects-container">
    <!-- Aspects & Criteria akan di-render oleh JavaScript -->
</div>

<div class="toolbar mt-10">
    <button class="btn btn-purple" onclick="showRanking()">🏆 Peringkat Alternatif</button>
</div>

<!-- Modal Rename -->
<div class="modal-overlay" id="rename-modal">
    <div class="modal-dialog">
        <h3>Ubah Nama Departemen</h3>
        <div class="form-group">
            <label>Nama Departemen</label>
            <input type="text" id="rename-input" class="form-input" value="{{ department.name }}">
        </div>
        <div class="modal-actions">
            <button class="btn btn-gray" onclick="closeModal('rename-modal')">Batal</button>
            <button class="btn btn-green" onclick="saveRename()">Simpan</button>
        </div>
    </div>
</div>

<!-- Modal Profile -->
<div class="modal-overlay" id="profile-modal">
    <div class="modal-dialog">
        <h3 id="profile-modal-title">Tambah Kriteria</h3>
        <input type="hidden" id="profile-edit-id">
        <input type="hidden" id="profile-aspect-id">
        <div class="form-group">
            <label for="profile-criteria">Kriteria</label>
            <select id="profile-criteria" class="form-select"></select>
        </div>
        <div class="form-group">
            <label for="profile-target">Target Value</label>
            <input type="number" id="profile-target" class="form-input" step="0.5" min="0" max="5" value="0">
        </div>
        <div class="form-group">
            <label for="profile-weight">Bobot (0-1)</label>
            <input type="number" id="profile-weight" class="form-input" step="0.001" min="0" max="1" value="0.5">
        </div>
        <div class="form-group">
            <label>Tipe Faktor</label>
            <div class="radio-group">
                <label><input type="radio" name="profile-type" value="core" checked> Core</label>
                <label><input type="radio" name="profile-type" value="secondary"> Secondary</label>
            </div>
        </div>
        <div class="form-group" id="profile-active-group" style="display:none;">
            <label><input type="checkbox" id="profile-active" class="form-checkbox" checked> Profil Aktif</label>
        </div>
        <div class="modal-actions">
            <button class="btn btn-gray" onclick="closeModal('profile-modal')">Batal</button>
            <button class="btn btn-green" onclick="saveProfile()">Simpan</button>
        </div>
    </div>
</div>

<!-- Modal Ranking -->
<div class="modal-overlay" id="ranking-modal">
    <div class="modal-dialog" style="min-width:600px;max-width:700px;">
        <h3>Hasil Peringkat Alternatif</h3>
        <table class="data-table" id="ranking-table">
            <thead>
                <tr>
                    <th>Peringkat</th>
                    <th style="width:auto">Nama Calon</th>
                    <th>Skor Tiap Aspek</th>
                    <th>NCF/NSF Tiap Aspek</th>
                    <th>Nilai Akhir</th>
                </tr>
            </thead>
            <tbody id="ranking-table-body">
                <tr><td colspan="5" style="text-align:center;">Memuat...</td></tr>
            </tbody>
        </table>
        <div class="modal-actions">
            <button class="btn btn-gray" onclick="closeModal('ranking-modal')">Tutup</button>
        </div>
    </div>
</div>

<input type="hidden" id="dept-id" value="{{ department.id }}">
{% endblock %}

{% block scripts %}
<script>
const DEPT_ID = parseInt(document.getElementById('dept-id').value, 10);
let aspectsMap = {};
let aspectsList = [];

// ============================================================
// Load aspects & profiles, render grouped by aspect
// ============================================================

function loadAspectsAndProfiles() {
    Promise.all([
        fetch('/api/aspects').then(r => r.json()),
        fetch(`/api/departments/${DEPT_ID}/profiles`).then(r => r.json()),
        fetch('/api/criteria').then(r => r.json())
    ]).then(([aspects, profiles, criteria]) => {
        aspectsMap = {};
        aspectsList = aspects;
        aspects.forEach(a => { aspectsMap[a.id] = a; });

        // Kelompokkan profiles by aspect_id
        const profilesByAspect = {};
        profiles.forEach(p => {
            const aid = p.aspect_id || 'no_aspect';
            if (!profilesByAspect[aid]) profilesByAspect[aid] = [];
            profilesByAspect[aid].push(p);
        });

        const container = document.getElementById('aspects-container');
        container.innerHTML = '';

        // Render UNGROUPED profiles (no aspect) first
        if (profilesByAspect['no_aspect']) {
            let html = '<div class="ie-card" style="margin-bottom:15px;"><h3 style="color:#f0f0f0;margin-bottom:10px;">Kriteria Tanpa Aspek</h3>';
            html += buildProfileTable(profilesByAspect['no_aspect']);
            html += `<button class="btn btn-green btn-sm mt-10" onclick="openProfileModal(null)">+ Tambah Kriteria</button>`;
            html += '</div>';
            container.innerHTML += html;
        }

        // Render profiles by aspect
        aspects.forEach(asp => {
            const aid = asp.id;
            if (!profilesByAspect[aid]) {
                // Aspect exists but no criteria yet
                let html = `<div class="ie-card" style="margin-bottom:15px;">`;
                html += `<div class="header-info"><h3 style="color:#ecec13;margin:0;">📊 ${escapeHtml(asp.name)}</h3><span style="color:#999;">Bobot: ${asp.weight}</span></div>`;
                html += `<p style="color:#666;">Belum ada kriteria. Tambah kriteria untuk aspek ini.</p>`;
                html += `<button class="btn btn-green btn-sm mt-10" onclick="openProfileModal(${aid})">+ Tambah Kriteria ke Aspek</button>`;
                html += '</div>';
                container.innerHTML += html;
                return;
            }
            const pList = profilesByAspect[aid];
            let html = `<div class="ie-card" style="margin-bottom:15px;">`;
            html += `<div class="header-info"><h3 style="color:#ecec13;margin:0;">📊 ${escapeHtml(asp.name)}</h3><span style="color:#999;">Bobot: ${asp.weight}</span></div>`;
            html += buildProfileTable(pList);
            html += `<button class="btn btn-green btn-sm mt-10" onclick="openProfileModal(${aid})">+ Tambah Kriteria</button>`;
            html += '</div>';
            container.innerHTML += html;
        });

        // Save criteria list for modal
        window.criteriaList = criteria;
    })
    .catch(err => console.error(err));
}

function buildProfileTable(profiles) {
    let table = `<table class="data-table" style="margin-top:8px;">
        <thead><tr>
            <th>Kriteria</th><th>Target</th><th>Bobot</th><th>Tipe</th><th>Aksi</th>
        </tr></thead><tbody>`;
    profiles.forEach(p => {
        let typeDisplay = p.type === 'core' ? 'Core' : 'Secondary';
        if (!p.is_active) typeDisplay += ' (nonaktif)';
        table += `<tr>
            <td>${escapeHtml(p.criteria_name)}</td>
            <td>${p.target_value}</td>
            <td>${p.weight.toFixed(3)}</td>
            <td>${typeDisplay}</td>
            <td>
                <div class="btn-group">
                    <button class="btn btn-orange btn-sm" onclick="editProfile(${p.id})">Edit</button>
                    <button class="btn btn-red btn-sm" onclick="deleteProfile(${p.id})">Hapus</button>
                </div>
            </td>
        </tr>`;
    });
    table += '</tbody></table>';
    return table;
}

// ============================================================
// Profile CRUD
// ============================================================

function openProfileModal(aspectId) {
    document.getElementById('profile-modal-title').textContent = 'Tambah Kriteria';
    document.getElementById('profile-edit-id').value = '';
    document.getElementById('profile-aspect-id').value = aspectId || '';
    document.getElementById('profile-target').value = 0;
    document.getElementById('profile-weight').value = 0.5;
    document.querySelector('input[name="profile-type"][value="core"]').checked = true;
    document.getElementById('profile-active-group').style.display = 'none';
    // Load criteria
    const sel = document.getElementById('profile-criteria');
    sel.innerHTML = '';
    (window.criteriaList || []).forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name;
        sel.appendChild(opt);
    });
    openModal('profile-modal');
}

function editProfile(id) {
    fetch(`/api/departments/${DEPT_ID}/profiles`)
        .then(r => r.json())
        .then(profiles => {
            const p = profiles.find(x => x.id === id);
            if (!p) return;
            document.getElementById('profile-modal-title').textContent = 'Edit Kriteria';
            document.getElementById('profile-edit-id').value = p.id;
            document.getElementById('profile-aspect-id').value = p.aspect_id || '';
            const sel = document.getElementById('profile-criteria');
            sel.innerHTML = '';
            (window.criteriaList || []).forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.name;
                if (c.id === p.criteria_id) opt.selected = true;
                sel.appendChild(opt);
            });
            document.getElementById('profile-target').value = p.target_value;
            document.getElementById('profile-weight').value = p.weight;
            document.querySelector(`input[name="profile-type"][value="${p.type}"]`).checked = true;
            document.getElementById('profile-active').checked = !!p.is_active;
            document.getElementById('profile-active-group').style.display = 'block';
            openModal('profile-modal');
        })
        .catch(err => console.error(err));
}

function saveProfile() {
    const id = document.getElementById('profile-edit-id').value;
    const criteria_id = document.getElementById('profile-criteria').value;
    const target_value = parseFloat(document.getElementById('profile-target').value);
    const weight = parseFloat(document.getElementById('profile-weight').value);
    const type_ = document.querySelector('input[name="profile-type"]:checked').value;
    const is_active = document.getElementById('profile-active').checked ? 1 : 0;
    const aspect_id = document.getElementById('profile-aspect-id').value || null;

    if (!criteria_id) {
        showAlert('Pilih kriteria terlebih dahulu', 'error');
        return;
    }

    const body = {target_value, weight, type: type_, aspect_id};
    if (id) {
        body.is_active = is_active;
        fetch(`/api/profiles/${id}`, {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
        .then(r => r.json()).then(res => {
            if (res.error) { showAlert(res.error, 'error'); return; }
            closeModal('profile-modal'); loadAspectsAndProfiles(); showAlert(res.message, 'success');
        })
        .catch(err => console.error(err));
    } else {
        body.criteria_id = parseInt(criteria_id);
        fetch(`/api/departments/${DEPT_ID}/profiles`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
        .then(r => r.json()).then(res => {
            if (res.error) { showAlert(res.error, 'error'); return; }
            closeModal('profile-modal'); loadAspectsAndProfiles(); showAlert(res.message, 'success');
        })
        .catch(err => console.error(err));
    }
}

function deleteProfile(id) {
    if (!confirm('Hapus kriteria ini?')) return;
    fetch(`/api/profiles/${id}`, {method: 'DELETE'})
        .then(r => r.json()).then(res => {
            if (res.error) { showAlert(res.error, 'error'); return; }
            loadAspectsAndProfiles(); showAlert(res.message, 'success');
        })
        .catch(err => console.error(err));
}

// ============================================================
// Rename
// ============================================================

function renameDepartment() {
    document.getElementById('rename-input').value = document.querySelector('.page-title').textContent.replace('🏢 ', '');
    openModal('rename-modal');
}

function saveRename() {
    const name = document.getElementById('rename-input').value.trim();
    if (!name) { showAlert('Nama departemen harus diisi', 'error'); return; }
    fetch(`/api/departments/${DEPT_ID}`, {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name})})
    .then(r => r.json()).then(res => {
        if (res.error) { showAlert(res.error, 'error'); return; }
        closeModal('rename-modal');
        document.querySelector('.page-title').textContent = '🏢 ' + name;
        showAlert(res.message, 'success');
    })
    .catch(err => console.error(err));
}

// ============================================================
// Ranking Detail
// ============================================================

function showRanking() {
    openModal('ranking-modal');
    document.getElementById('ranking-table-body').innerHTML = '<tr><td colspan="5" style="text-align:center;">Memuat...</td></tr>';
    fetch(`/api/departments/${DEPT_ID}/ranking-detail`)
        .then(r => r.json())
        .then(data => {
            const tbody = document.getElementById('ranking-table-body');
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#95a5a6;">Belum ada data peringkat.</td></tr>';
                return;
            }
            data.forEach((r, idx) => {
                // Build aspect scores string
                let skorStr = '';
                let ncfnsfStr = '';
                if (r.aspect_scores && r.aspect_scores.length > 0) {
                    r.aspect_scores.forEach(as => {
                        const aspName = as.aspect_name || 'Tanpa Aspek';
                        skorStr += `<div>${escapeHtml(aspName)}: ${as.nilai_aspek.toFixed(3)}</div>`;
                        ncfnsfStr += `<div>${escapeHtml(aspName)}: NCF=${as.ncf.toFixed(3)}, NSF=${as.nsf.toFixed(3)}</div>`;
                    });
                }
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="text-align:center;font-weight:bold;color:#ecec13;">${idx + 1}</td>
                    <td style="font-weight:bold;">${escapeHtml(r.name)}</td>
                    <td>${skorStr || '-'}</td>
                    <td>${ncfnsfStr || '-'}</td>
                    <td style="font-weight:bold;color:#2ecc71;">${r.total.toFixed(3)}</td>
                `;
                tbody.appendChild(tr);
            });
        })
        .catch(err => {
            console.error(err);
            document.getElementById('ranking-table-body').innerHTML = '<tr><td colspan="5" style="text-align:center;color:#95a5a6;">Gagal memuat peringkat.</td></tr>';
        });
}

// ============================================================
// Init
// ============================================================

loadAspectsAndProfiles();
</script>
{% endblock %}
