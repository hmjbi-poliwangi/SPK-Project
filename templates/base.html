<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPK Profile Matching</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Sidebar -->
      <nav class="sidebar">
        <a href="/" class="brand">
          <span class="brand-mark">🎯</span>
          <span class="brand-text">
            <strong>SPK</strong>
            <small>Profile Matching</small>
          </span>
        </a>

        <div class="sidebar-label">Navigation</div>
        <a href="/" class="nav-btn" data-page="home">🏠 Beranda</a>
        <a href="/criteria" class="nav-btn" data-page="criteria">📋 Kriteria</a>
        <a href="/departments" class="nav-btn" data-page="departments">🏢 Departemen</a>
        <a href="/alternatives" class="nav-btn" data-page="alternatives">👥 Alternatif</a>
        <a href="/aspects" class="nav-btn" data-page="aspects">📊 Aspek</a>

        <div class="sidebar-label">Tools</div>
        <a href="/import-export" class="nav-btn" data-page="import-export">📦 Import / Export</a>

        <div class="sidebar-footer">SPK Profile Matching · v1</div>
      </nav>

      <!-- Content -->
      <main class="content">
        <div id="alert-container"></div>
        {% block content %}{% endblock %}
      </main>
    </div>

    <script src="/static/js/main.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
