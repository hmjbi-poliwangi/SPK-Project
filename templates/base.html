<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPK Profile Matching</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: '#14161f',
              'bg-2': '#171a26',
              surface: '#20222f',
              'surface-2': '#262a3a',
              accent: '#f2c94c',
              muted: '#9aa1b0',
              success: '#2fbf71',
              danger: '#e5484d',
              info: '#3d9bf1',
              warning: '#f2994a',
              purple: '#9b59b6',
            },
            fontFamily: {
              sans: ['Inter', 'Segoe UI', 'system-ui', 'sans-serif'],
            },
          }
        }
      }
    </script>
    <link rel="stylesheet" href="/static/css/style.css" />
    <style type="text/tailwindcss">
      @layer components {
        .btn {
          @apply inline-flex items-center gap-1.5 px-4 py-2 font-semibold rounded-lg border border-transparent cursor-pointer text-sm transition-all duration-150 shadow-md;
        }
        .btn:hover {
          @apply -translate-y-0.5 brightness-110;
        }
        .btn:active {
          @apply translate-y-0;
        }
        .btn:disabled {
          @apply opacity-45 cursor-not-allowed;
        }
        .btn-yellow { @apply bg-accent text-bg; }
        .btn-green { @apply bg-success text-white; }
        .btn-blue { @apply bg-info text-white; }
        .btn-red { @apply bg-danger text-white; }
        .btn-orange { @apply bg-warning text-bg; }
        .btn-purple { @apply bg-purple text-white; }
        .btn-gray { @apply bg-[#3b4154] text-gray-200; }
        .btn-sm { @apply px-2.5 py-1.5 text-xs rounded-md shadow-none; }
        .btn-group { @apply inline-flex gap-2 flex-wrap; }

        .badge {
          @apply inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-semibold;
        }
        .badge-core { @apply bg-purple/20 text-[#b3a5ff]; }
        .badge-secondary { @apply bg-info/20 text-[#8fc3ff]; }
        .badge-inactive { @apply bg-danger/15 text-[#ff9b9b]; }

        .form-group { @apply mb-3.5; }
        .form-label { @apply block text-gray-300 mb-1.5 font-semibold text-[12.5px]; }
        .form-input, .form-select, .form-textarea {
          @apply w-full bg-[#1b1e2a] text-white border border-[#3a4054] rounded-lg px-3 py-2 text-sm transition-all duration-150;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
          @apply outline-none border-accent ring-2 ring-accent/20;
        }
        .form-select option { @apply bg-[#1b1e2a] text-white; }
        .form-textarea { @apply min-h-[84px] resize-y; }

        .radio-group { @apply flex gap-2.5 items-center flex-wrap; }
        .radio-group label {
          @apply inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg cursor-pointer bg-white/5 transition-colors;
        }
        .radio-group label:has(input:checked) { @apply bg-accent/15; }
        .radio-group input[type='radio'] { @apply accent-accent; }

        .modal-overlay {
          @apply fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center;
        }
        .modal-overlay.open { @apply flex; }
        .modal-dialog {
          @apply bg-surface border border-white/10 rounded-2xl shadow-2xl p-6 w-full max-w-md mx-4;
        }
        .modal-dialog h3 { @apply text-accent text-lg font-bold tracking-wide; }
        .modal-actions { @apply flex justify-end gap-2.5 mt-5; }

        .score-list { @apply flex flex-col gap-1; }
        .score-row {
          @apply flex justify-between items-center gap-3.5 px-3.5 py-2.5 bg-white/5 border border-white/10 rounded-lg transition-all duration-150;
        }
        .score-row:hover { @apply bg-white/10; }
        .score-number { @apply text-accent font-bold text-sm min-w-[20px]; }
        .score-label { @apply font-semibold text-white flex-1; }
        .score-input {
          @apply w-24 px-2.5 py-2 text-right bg-[#1b1e2a] text-white border border-[#3a4054] rounded-lg text-sm transition-all duration-150;
        }
        .score-input:focus {
          @apply outline-none border-accent ring-2 ring-accent/20;
        }

        .ie-container { @apply grid grid-cols-1 md:grid-cols-2 gap-5; }
        .ie-card {
          @apply bg-surface border border-white/10 rounded-xl p-5 shadow-lg transition-all duration-200;
        }
        .ie-card:hover { @apply shadow-xl -translate-y-0.5; }
        .ie-card-title { @apply text-lg font-bold text-accent mb-1.5; }
        .ie-card-desc { @apply text-muted text-sm mb-4; }
        .ie-status {
          @apply mt-3.5 px-3.5 py-2.5 rounded-lg bg-white/5 min-h-[20px] text-sm;
        }
        .ie-preview {
          @apply bg-[#171a26] border border-white/10 rounded-lg p-3 my-2.5 max-h-[220px] overflow-y-auto text-[12.5px] text-muted;
        }
        .ie-pre {
          @apply bg-[#0f1116] text-[#8ff0c4] p-2.5 rounded-lg text-[11.5px] overflow-x-auto whitespace-pre-wrap break-all mt-1.5 font-mono;
        }
        .ie-export-group { @apply mb-3.5; }
        .ie-subtitle { @apply text-sm font-semibold text-gray-200 mb-1; }
        .ie-desc { @apply text-xs text-muted mb-2 leading-relaxed; }
        .ie-divider { @apply border-0 border-t border-white/10 my-4; }

        .hero-card {
          @apply bg-gradient-to-br from-accent/10 to-purple/10 border border-white/10 rounded-2xl p-12 text-center;
        }
        .hero-icon { @apply text-5xl; }
        .hero-actions { @apply flex gap-3.5 flex-wrap justify-center mt-5; }

        .aspect-group-header td {
          @apply bg-gradient-to-r from-accent/15 to-purple/10 text-accent font-bold px-3 py-2 tracking-wide;
        }

        .resize-handle {
          @apply absolute top-0 bottom-0 right-[-3px] w-1.5 cursor-col-resize z-[5] bg-transparent;
        }
        .resize-handle::after {
          content: '';
          @apply absolute top-[20%] bottom-[20%] w-0.5 right-0.5 bg-white/20 rounded opacity-0 transition-opacity;
        }
        thead th:hover .resize-handle::after { @apply opacity-100; }
      }

      @layer utilities {
        .text-success { @apply text-success; }
        .text-error { @apply text-danger; }
        .text-info { @apply text-info; }
        .text-muted { @apply text-muted; }
        .mt-10 { @apply mt-2.5; }
        .mt-20 { @apply mt-5; }
        .header-info { @apply flex items-center gap-3.5 flex-wrap mb-4; }
        .toolbar { @apply flex gap-3 items-center flex-wrap mb-4; }
        .table-wrapper { @apply w-full overflow-x-auto mb-4; }
        .data-table { @apply w-full border-collapse rounded-xl overflow-hidden text-[13.5px]; }
        .data-table thead th {
          @apply bg-surface-2 text-gray-200 font-semibold text-left px-3 py-2.5 whitespace-nowrap border-b-2 border-white/15;
        }
        .data-table tbody td { @apply px-3 py-2.5 border-b border-white/10; }
        .data-table tbody tr:last-child td { @apply border-b-0; }
        .data-table tbody tr:nth-child(even) { @apply bg-white/[0.028]; }
        .data-table tbody tr:hover td { @apply bg-purple/10; }
        .data-table a.link-brand { @apply text-accent no-underline font-semibold; }
        .data-table a.link-brand:hover { @apply underline; }
        .page-title { @apply text-2xl font-bold text-accent tracking-wide mb-4; }
        .page-subtitle { @apply text-sm text-muted mt-1.5; }
        .home-title { @apply text-3xl font-bold text-accent text-center tracking-wide; }

        .animate-modal-in { animation: modalIn 0.25s ease-out; }
        .animate-alert-in { animation: alertIn 0.3s ease-out; }

        @keyframes modalIn {
          0% { opacity: 0; transform: translateY(15px) scale(0.97); }
          100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes alertIn {
          0% { opacity: 0; transform: translateX(20px); }
          100% { opacity: 1; transform: translateX(0); }
        }
      }
    </style>
  </head>
  <body class="bg-bg text-white font-sans min-h-screen">
    <div class="flex min-h-screen">
      <!-- Mobile Menu Button -->
      <button id="mobile-menu-btn" class="lg:hidden fixed top-4 left-4 z-50 bg-surface p-2 rounded-lg border border-white/10">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>

      <!-- Sidebar -->
      <nav id="sidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-64 lg:w-64 min-w-[236px] bg-gradient-to-b from-[#131722] to-[#1a1d29] border-r border-white/10 flex flex-col p-4 transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
        <a href="/" class="flex items-center gap-3 text-white p-3 rounded-xl hover:bg-white/5 transition">
          <span class="text-2xl w-10 h-10 grid place-items-center bg-accent text-bg rounded-xl shadow-lg">🎯</span>
          <span class="flex flex-col leading-tight">
            <strong class="text-base tracking-wide">SPK</strong>
            <small class="text-xs text-muted">Profile Matching</small>
          </span>
        </a>

        <div class="text-[10.5px] uppercase tracking-wider text-gray-500 px-3 pt-4 pb-1">Navigation</div>
        <a href="/" class="flex items-center gap-2 text-gray-300 hover:text-white hover:bg-white/5 px-3 py-2.5 rounded-lg text-sm font-medium transition" data-page="home">🏠 Beranda</a>
        <a href="/criteria" class="flex items-center gap-2 text-gray-300 hover:text-white hover:bg-white/5 px-3 py-2.5 rounded-lg text-sm font-medium transition" data-page="criteria">📋 Kriteria</a>
        <a href="/departments" class="flex items-center gap-2 text-gray-300 hover:text-white hover:bg-white/5 px-3 py-2.5 rounded-lg text-sm font-medium transition" data-page="departments">🏢 Departemen</a>
        <a href="/alternatives" class="flex items-center gap-2 text-gray-300 hover:text-white hover:bg-white/5 px-3 py-2.5 rounded-lg text-sm font-medium transition" data-page="alternatives">👥 Alternatif</a>
        <a href="/aspects" class="flex items-center gap-2 text-gray-300 hover:text-white hover:bg-white/5 px-3 py-2.5 rounded-lg text-sm font-medium transition" data-page="aspects">📊 Aspek</a>

        <div class="text-[10.5px] uppercase tracking-wider text-gray-500 px-3 pt-4 pb-1">Tools</div>
        <a href="/import-export" class="flex items-center gap-2 text-gray-300 hover:text-white hover:bg-white/5 px-3 py-2.5 rounded-lg text-sm font-medium transition" data-page="import-export">📦 Import / Export</a>

        <div class="mt-auto text-[10.5px] text-gray-600 text-center p-2 tracking-wide">SPK Profile Matching · v1</div>
      </nav>

      <!-- Overlay for mobile -->
      <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

      <!-- Content -->
      <main class="flex-1 p-4 lg:p-8 overflow-y-auto">
        <div id="alert-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm"></div>
        {% block content %}{% endblock %}
      </main>
    </div>

    <script src="/static/js/main.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
